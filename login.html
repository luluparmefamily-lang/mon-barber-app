<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - BarberApp</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #FAF3F3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #D4A5A5; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #DDD; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #D4A5A5; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #b88a8a; }
        .error { color: #FF4B4B; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h1>Connexion</h1>
    <input type="email" id="email" placeholder="Email du salon">
    <input type="password" id="password" placeholder="Mot de passe">
    <button id="loginBtn">SE CONNECTER</button>
    <div id="errorMsg" class="error">Identifiants incorrects</div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // REMPLACE CES DEUX LIGNES PAR TES VRAIES CLÉS SUPABASE
    const supabaseUrl = 'https://TON_PROJET.supabase.co'
    const supabaseKey = 'TA_CLE_ANON_ICI'
    const supabase = createClient(supabaseUrl, supabaseKey)

    const loginBtn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');

    loginBtn.onclick = async () => {
        errorMsg.style.display = 'none';
        const { data, error } = await supabase.auth.signInWithPassword({
            email: emailInput.value,
            password: passInput.value,
        });

        if (error) {
            errorMsg.innerText = "Erreur : " + error.message;
            errorMsg.style.display = 'block';
        } else {
            // Redirige vers l'index si ça marche
            window.location.href = 'index.html';
        }
    };
</script>

</body>
</html>
