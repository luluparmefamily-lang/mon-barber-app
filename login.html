<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - BarberApp</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #FAF3F3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #D4A5A5; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #DDD; border-radius: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #D4A5A5; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .error { color: #FF4B4B; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Connexion</h1>
        <input type="email" id="email" placeholder="Email du salon">
        <input type="password" id="pass" placeholder="Mot de passe">
        <button id="btnLogin">Se connecter</button>
        <div id="msg" class="error"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://jspm.dev/@supabase/supabase-js'
        const supabase = createClient('https://suxqpgkdgwordhoffrpl.supabase.co', 'sb_publishable_Wih7gy1d2OX6S57Qv6drKw_5p1UJ2C2')

        document.getElementById('btnLogin').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('msg').innerText = "Erreur : " + error.message;
            } else {
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
