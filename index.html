<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberApp Pro - Dashboard CRM</title>
    
    <style>
        :root {
            --primary-color: #D4A5A5;
            --bg-color: #FAF3F3;
            --card-color: #FFFFFF;
            --text-color: #4A4A4A;
            --accent-glow: rgba(212, 165, 165, 0.2);
            --border-radius: 20px;
            --success: #00D68F;
            --danger: #FF4B4B;
            --gold: #FFD700;
            --whatsapp: #25D366;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: auto; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; border-left: 5px solid var(--primary-color); padding-left: 20px;
        }

        .header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 3px; text-transform: uppercase; color: var(--primary-color); }

        .btn-export { background: transparent; border: 1px solid var(--primary-color); color: var(--primary-color); padding: 8px 18px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-logout { background: #eee; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-size: 12px; margin-left: 10px; }

        .top-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; margin-bottom: 30px; }

        .glass-panel { background: var(--card-color); padding: 30px; border-radius: var(--border-radius); box-shadow: 0 10px 40px rgba(0,0,0,0.05); }

        .panel-label { color: var(--primary-color); font-size: 11px; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; text-transform: uppercase; }

        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-form input { width: 100%; }
        .grid-form .full { grid-column: span 2; }

        input { padding: 16px; border-radius: 12px; border: 1px solid #DDD; background: #FFF; color: #333; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 10px var(--accent-glow); }

        .btn-main { background: var(--primary-color); color: white; padding: 14px 28px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; }

        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-filter { background: white; border: 1px solid var(--primary-color); color: var(--primary-color); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-filter.active { background: var(--primary-color); color: white; }
        .btn-filter.danger { border-color: var(--danger); color: var(--danger); }
        .btn-filter.danger.active { background: var(--danger); color: white; }

        .table-container { background: var(--card-color); border-radius: var(--border-radius); overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }

        table { width: 100%; border-collapse: collapse; }
        th { background: #FDFDFD; padding: 20px; text-align: left; font-size: 12px; color: #999; text-transform: uppercase; }
        td { padding: 20px; border-top: 1px solid #F5F5F5; }

        .client-info b { display: inline-block; font-size: 17px; color: #333; cursor: pointer; transition: 0.2s; }
        .client-info b:hover { color: var(--primary-color); text-decoration: underline; }

        .status-alert { color: var(--danger); font-size: 10px; font-weight: 900; margin-top: 4px; display: block; text-transform: uppercase; }

        .gift-badge { background: var(--gold); color: #000; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 50px; margin-left: 10px; vertical-align: middle; animation: pulse-gold 1.5s infinite; display: inline-flex; align-items: center; gap: 4px; }

        @keyframes pulse-gold {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        .points-badge { background: var(--bg-color); color: var(--primary-color); padding: 6px 12px; border-radius: 8px; font-weight: bold; }
        .progress-bar { width: 140px; height: 6px; background: #EEE; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-color); transition: 0.5s ease; }

        .btn-action { width: 42px; height: 42px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-plus { background: #E8F8F2; color: var(--success); }
        .btn-moins { background: #FEF2E8; color: #FF7A00; }
        .btn-del { background: #FFEBEB; color: var(--danger); }
        .btn-wa { background: #E8F5E9; color: var(--whatsapp); font-size: 18px; }

        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center; backdrop-filter: blur(5px); }
        .modal-content { background: #FFF; padding: 30px; border-radius: var(--border-radius); width: 90%; max-width: 550px; max-height: 85vh; overflow-y: auto; }
        
        .profile-card { background: #F9F9F9; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #EEE; position: relative; }
        .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .info-group label { display: block; font-size: 10px; color: #AAA; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        .info-group span { font-weight: 600; color: #333; word-break: break-all; }
        .info-group input { width: 100%; padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid #DDD; background: white; }
        .info-group.full { grid-column: span 2; }

        .btn-edit-profile { position: absolute; top: 10px; right: 10px; background: #EEE; border: none; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .histo-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #FDFDFD; border-radius: 10px; margin-bottom: 10px; border: 1px solid #EEE; }

        .gift-box { background: #FFF9F9; border: 2px dashed var(--primary-color); padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .gift-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-redeem { padding: 8px 15px; border-radius: 8px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-redeem.active { background: var(--success); color: white; }
        .btn-redeem.locked { background: #EEE; color: #AAA; cursor: not-allowed; }

        #toast { visibility: hidden; min-width: 280px; background-color: #333; color: #fff; text-align: center; border-radius: 12px; padding: 16px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
    </style>
</head>
<body>

<div id="toast">Message</div>

<div id="histoModal" class="modal">
    <div class="modal-content">
        <div>
            <h2 id="histoTitle" style="color:var(--primary-color); margin:0;">Détails Client</h2>
            <p id="mPoints" style="font-size: 1.5rem; font-weight: 900; color: var(--primary-color); margin: 5px 0 20px 0;">0 PTS</p>
        </div>
        
        <div class="profile-card">
            <button class="btn-edit-profile" id="btnToggleEdit">Modifier ✏️</button>
            
            <div id="profileView" class="profile-grid">
                <div class="info-group">
                    <label>Téléphone</label>
                    <span id="mTel">--</span>
                </div>
                <div class="info-group">
                    <label>Email</label>
                    <span id="mEmail">--</span>
                </div>
                <div class="info-group full">
                    <label>Adresse</label>
                    <span id="mAddr">--</span>
                </div>
            </div>
            
            <div id="profileEdit" class="profile-grid" style="display: none;">
                <div class="info-group full">
                    <label>Nom complet *</label>
                    <input type="text" id="editNom">
                </div>
                <div class="info-group">
                    <label>Téléphone</label>
                    <input type="text" id="editTel">
                </div>
                <div class="info-group">
                    <label>Email</label>
                    <input type="email" id="editEmail">
                </div>
                <div class="info-group full">
                    <label>Adresse</label>
                    <input type="text" id="editAddr">
                </div>
                <div class="info-group full" style="text-align: right; margin-top: 10px;">
                    <button id="btnSaveProfile" class="btn-main" style="padding: 8px 20px; font-size: 12px;">Enregistrer les modifs</button>
                </div>
            </div>
        </div>

        <div class="gift-box">
            <p class="panel-label" style="margin-bottom:10px;">🎁 Récompenses disponibles</p>
            <div id="giftList"></div>
        </div>

        <div style="margin-bottom:20px;">
            <p class="panel-label">Nouvelle Prestation</p>
            <div style="display:flex; gap:10px;">
                <input type="text" id="prestaInput" placeholder="ex: Coupe + Barbe">
                <button id="btnAjouterVisite" class="btn-main">+</button>
            </div>
        </div>

        <p class="panel-label">Historique des passages</p>
        <div id="histoList"></div>
        <button id="btnCloseModal" class="btn-main" style="width:100%; margin-top:20px; background:#333;">Fermer la fiche</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <h1>Barber<span style="font-weight: 200;">Shop</span></h1>
        <div>
            <button class="btn-export" id="btnExport">💾 Exporter (CSV)</button>
            <button class="btn-logout" id="btnLogout">Déconnexion 🚪</button>
        </div>
    </div>

    <div class="top-grid">
        <div class="glass-panel">
            <div class="panel-label">Nouveau Client</div>
            <div class="grid-form">
                <input type="text" id="newNom" placeholder="Nom complet (Requis) *">
                <input type="text" id="newTel" placeholder="Téléphone">
                <input type="email" id="newEmail" placeholder="Email" class="full">
                <input type="text" id="newAddr" placeholder="Adresse complète" class="full">
                <button id="btnAdd" class="btn-main full">Créer la fiche</button>
            </div>
        </div>
        <div class="glass-panel">
            <div class="panel-label">Recherche & Filtres</div>
            <input type="text" id="searchBar" placeholder="Nom, téléphone, ville...">
            <div class="filter-bar" style="margin-top:15px;">
                <button class="btn-filter active" id="btnAll" onclick="updateFilter('all')">Tous</button>
                <button class="btn-filter danger" id="btnLost" onclick="updateFilter('lost')">À relancer (+30j) ⚠️</button>
            </div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Client (cliquer pour fiche)</th>
                    <th>Fidélité</th>
                    <th>Actions rapides</th>
                </tr>
            </thead>
            <tbody id="clientBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://jspm.dev/@supabase/supabase-js'
    const SUPABASE_URL = 'https://suxqpgkdgwordhoffrpl.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_Wih7gy1d2OX6S57Qv6drKw_5p1UJ2C2'
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    let allClients = [];
    let currentClientId = null;
    let currentClientPoints = 0;
    let isEditing = false;
    let currentFilter = 'all';
    let currentUser = null;

    const cadeauxDispos = [
        { nom: "Soin Barbe Offert", prix: 50 },
        { nom: "Coupe Gratuite", prix: 100 }
    ];

    // VERIFICATION AUTHENTIFICATION
    async function checkUser() {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            window.location.href = 'login.html'; // Redirige si pas connecté
        } else {
            currentUser = session.user;
            loadClients();
        }
    }

    // DECONNEXION
    document.getElementById('btnLogout').onclick = async () => {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
    };

    // CHARGEMENT INITIAL (Filtré par salon)
    async function loadClients() {
        const { data, error } = await supabase
            .from('clients')
            .select('*, visites(created_at)')
            .eq('user_id', currentUser.id) // <--- ICI LA SECURITÉ
            .order('Nom', { ascending: true });
        
        if (data) {
            allClients = data.map(c => {
                const dates = c.visites.map(v => new Date(v.created_at));
                const lastDate = dates.length > 0 ? new Date(Math.max(...dates)) : null;
                let jours = 999;
                if(lastDate) {
                    jours = Math.floor((new Date() - lastDate) / (1000*60*60*24));
                }
                return { ...c, lastDate, jours };
            });
            renderTable();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('clientBody');
        tbody.innerHTML = ''; 
        
        let filtered = allClients;
        if(currentFilter === 'lost') {
            filtered = allClients.filter(c => c.jours >= 30);
        }

        filtered.forEach(client => {
            const pts = client.Points || 0;
            const hasFreeCut = pts >= 100;
            const isLost = client.jours >= 30;

            tbody.innerHTML += `
                <tr>
                    <td class="client-info">
                        <b class="client-name-click" data-id="${client.id}">
                            ${client.Nom}
                            ${hasFreeCut ? '<span class="gift-badge">✨ COUPE OFFERTE</span>' : ''}
                        </b>
                        ${isLost ? `<span class="status-alert">⚠️ Absent depuis ${client.jours} jours</span>` : ''}
                        <br><small style="color:#999">${client.Telephone || '---'}</small>
                    </td>
                    <td>
                        <span class="points-badge">${pts} PTS</span>
                        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(pts, 100)}%"></div></div>
                    </td>
                    <td style="display:flex; gap:8px; align-items:center;">
                        <button class="btn-action btn-plus" data-id="${client.id}" data-pts="${pts}">+</button>
                        <button class="btn-action btn-moins" data-id="${client.id}" data-pts="${pts}">-</button>
                        ${isLost ? `<button class="btn-action btn-wa" onclick="relancer('${client.Nom}', '${client.Telephone}')">📱</button>` : ''}
                        <button class="btn-action btn-del" data-id="${client.id}">🗑</button>
                    </td>
                </tr>`;
        });

        document.querySelectorAll('.client-name-click').forEach(b => {
            b.onclick = () => openHisto(b.getAttribute('data-id'));
        });
        document.querySelectorAll('.btn-plus').forEach(b => {
            b.onclick = () => updatePts(b.getAttribute('data-id'), parseInt(b.getAttribute('data-pts')) + 10);
        });
        document.querySelectorAll('.btn-moins').forEach(b => {
            b.onclick = () => updatePts(b.getAttribute('data-id'), parseInt(b.getAttribute('data-pts')) - 10);
        });
        document.querySelectorAll('.btn-del').forEach(b => {
            b.onclick = () => deleteClient(b.getAttribute('data-id'));
        });
    }

    window.updateFilter = (f) => {
        currentFilter = f;
        document.getElementById('btnAll').classList.toggle('active', f === 'all');
        document.getElementById('btnLost').classList.toggle('active', f === 'lost');
        renderTable();
    };

    window.relancer = (nom, tel) => {
        if(!tel || tel === '---') return showToast("Pas de numéro !", false);
        const msg = `Salut ${nom} ! C'est ton barbier ✂️. On ne t'a pas vu au shop depuis un petit moment, j'espère que tout va bien ? À bientôt !`;
        window.open(`https://wa.me/${tel.replace(/\s/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
    };

    async function openHisto(id) {
        const client = allClients.find(c => c.id == id);
        if(!client) return;
        currentClientId = id; 
        currentClientPoints = client.Points || 0;
        isEditing = false;
        document.getElementById('profileView').style.display = 'grid';
        document.getElementById('profileEdit').style.display = 'none';
        document.getElementById('btnToggleEdit').innerText = 'Modifier ✏️';
        document.getElementById('histoTitle').innerText = client.Nom;
        document.getElementById('mPoints').innerText = currentClientPoints + " PTS";
        document.getElementById('mTel').innerText = client.Telephone || "Non renseigné";
        document.getElementById('mEmail').innerText = client.Email || "Non renseigné";
        document.getElementById('mAddr').innerText = client.Adresse || "Non renseigné";
        document.getElementById('editNom').value = client.Nom;
        document.getElementById('editTel').value = client.Telephone || "";
        document.getElementById('editEmail').value = client.Email || "";
        document.getElementById('editAddr').value = client.Adresse || "";
        document.getElementById('histoModal').style.display = 'flex';
        renderGiftList();
        renderHistoItems();
    }

    document.getElementById('btnToggleEdit').onclick = () => {
        isEditing = !isEditing;
        document.getElementById('profileView').style.display = isEditing ? 'none' : 'grid';
        document.getElementById('profileEdit').style.display = isEditing ? 'grid' : 'none';
        document.getElementById('btnToggleEdit').innerText = isEditing ? 'Annuler ❌' : 'Modifier ✏️';
    };

    document.getElementById('btnSaveProfile').onclick = async () => {
        const nouveauNom = document.getElementById('editNom').value;
        const nouveauTel = document.getElementById('editTel').value;
        const nouvelEmail = document.getElementById('editEmail').value;
        const nouvelleAddr = document.getElementById('editAddr').value;
        if(!nouveauNom) return showToast("Le nom est obligatoire", false);
        const { error } = await supabase.from('clients').update({ 
            Nom: nouveauNom, Telephone: nouveauTel, Email: nouvelEmail, Adresse: nouvelleAddr 
        }).eq('id', currentClientId);
        if (error) showToast("Erreur de sauvegarde", false);
        else {
            showToast("Profil mis à jour !");
            await loadClients();
            openHisto(currentClientId);
        }
    };

    document.getElementById('btnAjouterVisite').onclick = async () => {
        const presta = document.getElementById('prestaInput').value || "Prestation standard";
        await supabase.from('visites').insert([{ client_id: currentClientId, prestation: presta, points_ajoutes: 10 }]);
        const nouveauxPts = currentClientPoints + 10;
        await supabase.from('clients').update({ Points: nouveauxPts }).eq('id', currentClientId);
        document.getElementById('prestaInput').value = '';
        await loadClients();
        openHisto(currentClientId);
        showToast("Visite ajoutée !");
    };

    async function renderHistoItems() {
        const { data } = await supabase.from('visites').select('*').eq('client_id', currentClientId).order('created_at', {ascending: false});
        const list = document.getElementById('histoList');
        list.innerHTML = (data && data.length) ? '' : '<p style="color:#999; text-align:center;">Aucun historique</p>';
        if (data) {
            data.forEach(v => {
                const date = new Date(v.created_at).toLocaleDateString('fr-FR');
                list.innerHTML += `
                    <div class="histo-item">
                        <div>
                            <small style="display:block; color:#999">${date}</small>
                            <b>${v.prestation}</b>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="color:${v.points_ajoutes >= 0 ? 'var(--success)' : 'var(--danger)'}; font-weight:bold;">
                                ${v.points_ajoutes > 0 ? '+' : ''}${v.points_ajoutes}
                            </span>
                            <button class="btn-del-visite" data-vid="${v.id}" data-vpts="${v.points_ajoutes}" style="border:none; background:none; cursor:pointer; font-size:18px;">×</button>
                        </div>
                    </div>`;
            });
            document.querySelectorAll('.btn-del-visite').forEach(b => {
                b.onclick = () => deleteVisite(b.getAttribute('data-vid'), b.getAttribute('data-vpts'));
            });
        }
    }

    async function deleteVisite(visiteId, ptsAEnlever) {
        if(confirm("Annuler cette opération ?")) {
            await supabase.from('visites').delete().eq('id', visiteId);
            const nouveauxPts = Math.max(0, currentClientPoints - parseInt(ptsAEnlever));
            await supabase.from('clients').update({ Points: nouveauxPts }).eq('id', currentClientId);
            await loadClients();
            openHisto(currentClientId);
            showToast("Opération annulée");
        }
    }

    function renderGiftList() {
        const container = document.getElementById('giftList');
        container.innerHTML = '';
        cadeauxDispos.forEach(cadeau => {
            const estDisponible = currentClientPoints >= cadeau.prix;
            const btn = document.createElement('button');
            btn.className = `btn-redeem ${estDisponible ? 'active' : 'locked'}`;
            btn.innerText = estDisponible ? 'Utiliser' : 'Points insuffisants';
            if(estDisponible) btn.onclick = () => utiliserCadeau(cadeau.nom, cadeau.prix);
            const div = document.createElement('div');
            div.className = 'gift-item';
            div.innerHTML = `<span>${cadeau.nom} <small>(${cadeau.prix}pts)</small></span>`;
            div.appendChild(btn);
            container.appendChild(div);
        });
    }

    async function utiliserCadeau(nomCadeau, cout) {
        if(confirm(`Offrir "${nomCadeau}" et déduire ${cout} points ?`)) {
            await supabase.from('visites').insert([{ client_id: currentClientId, prestation: `🎁 CADEAU : ${nomCadeau}`, points_ajoutes: -cout }]);
            await supabase.from('clients').update({ Points: currentClientPoints - cout }).eq('id', currentClientId);
            await loadClients();
            openHisto(currentClientId);
            showToast("Cadeau validé !");
        }
    }

    document.getElementById('searchBar').oninput = (e) => {
        const s = e.target.value.toLowerCase();
        const res = allClients.filter(c => c.Nom.toLowerCase().includes(s) || (c.Telephone && c.Telephone.includes(s)));
        const oldClients = allClients;
        allClients = res; renderTable(); allClients = oldClients;
    };

    document.getElementById('btnAdd').onclick = async () => {
        const Nom = document.getElementById('newNom').value;
        const Telephone = document.getElementById('newTel').value;
        const Email = document.getElementById('newEmail').value;
        const Adresse = document.getElementById('newAddr').value;
        if(Nom) {
            await supabase.from('clients').insert([{ 
                Nom, Telephone, Email, Adresse, Points: 0, 
                user_id: currentUser.id // <--- RATTACHEMENT AU SALON
            }]);
            document.querySelectorAll('.grid-form input').forEach(i => i.value = '');
            await loadClients();
            showToast("Client créé !");
        } else showToast("Nom obligatoire", false);
    };

    async function updatePts(id, newPts) {
        await supabase.from('clients').update({ Points: Math.max(0, newPts) }).eq('id', id);
        await loadClients();
        showToast("Points mis à jour");
    }

    async function deleteClient(id) {
        if(confirm("Supprimer le client ?")) {
            await supabase.from('clients').delete().eq('id', id);
            await loadClients();
            showToast("Client supprimé", false);
        }
    }

    document.getElementById('btnCloseModal').onclick = () => { document.getElementById('histoModal').style.display = 'none'; };

    document.getElementById('btnExport').onclick = () => {
        let csv = "Nom,Telephone,Email,Adresse,Points\n";
        allClients.forEach(c => { csv += `"${c.Nom}","${c.Telephone || ''}","${c.Email || ''}","${c.Adresse || ''}",${c.Points}\n` });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'clients_barbershop.csv'; a.click();
    };

    function showToast(msg, success = true) {
        const x = document.getElementById("toast");
        x.innerText = msg; x.style.backgroundColor = success ? "#333" : "#FF4B4B";
        x.className = "show"; setTimeout(() => { x.className = ""; }, 3000);
    }

    checkUser(); // <--- LANCEMENT
</script>
</body>
</html>
